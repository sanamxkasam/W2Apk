name: Build Real Android APK

on:
  repository_dispatch:
    types: [build_apk]
    workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Capacitor Android APK
        run: |
          npm install -g @capacitor/cli @capacitor/core @capacitor/android
          
          mkdir -p www
          echo "${{ github.event.client_payload.html_content }}" > www/index.html
          
          # Create package.json if not exists
          if [ ! -f package.json ]; then
            echo '{"name":"temp-app","version":"1.0.0","private":true}' > package.json
          fi
          
          npx cap init "${{ github.event.client_payload.app_name }}" "com.mirrykal.app" --web-dir www
          
          npx cap add android
          npx cap sync android
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name }}-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
