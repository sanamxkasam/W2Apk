<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRRYKAL (Web2Apps)</title>
    <style>
        :root {
            --bg: #060913;
            --card: #0f172a;
            --accent: #00f2fe;
            --gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #6b11ff 100%);
            --text: #f8fafc;
            --sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        .hero { text-align: center; padding: 60px 20px 40px 20px; }
        .logo-title {
            font-size: 2.8rem; font-weight: 900; letter-spacing: 2px;
            background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.3); margin-bottom: 8px;
        }
        .tagline { color: var(--sub); font-size: 1rem; margin-bottom: 24px; }
        
        .start-btn {
            background: var(--gradient); color: white; border: none; padding: 14px 32px;
            border-radius: 30px; font-weight: 700; font-size: 1rem; cursor: pointer;
            box-shadow: 0 10px 25px rgba(79, 172, 254, 0.4); transition: transform 0.2s;
        }
        .start-btn:active { transform: scale(0.95); }

        .app-box { max-width: 500px; margin: 0 auto 50px auto; padding: 0 20px; display: none; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 24px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }

        .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: rgba(0,0,0,0.3); padding: 4px; border-radius: 12px; }
        .tab { flex: 1; text-align: center; padding: 10px; font-size: 0.82rem; font-weight: 600; color: var(--sub); border-radius: 8px; cursor: pointer; }
        .tab.active { background: rgba(255,255,255,0.08); color: var(--accent); }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; color: var(--sub); margin-bottom: 6px; font-weight: 600; }
        input[type="text"], input[type="url"], textarea, select {
            width: 100%; background: #060913; border: 1px solid var(--border); color: #fff;
            padding: 12px; border-radius: 10px; font-size: 0.9rem; outline: none;
        }
        input[type="file"] { color: var(--sub); font-size: 0.85rem; }

        .next-btn {
            width: 100%; background: var(--gradient); border: none; color: white; padding: 14px;
            border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px;
        }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        .spinner { width: 50px; height: 50px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-text { margin-top: 20px; font-weight: 600; font-size: 1.1rem; color: var(--accent); }
        .dl-btn { background: #10b981; color: white; text-decoration: none; padding: 14px 28px; border-radius: 12px; font-weight: 700; margin-top: 20px; display: none; }
    </style>
</head>
<body>

    <div class="hero">
        <div class="logo-title">MIRRYKAL</div>
        <div class="tagline">Next-Gen Web2Apps Converter</div>
        <button class="start-btn" onclick="startFlow()">Get Started</button>
    </div>

    <div class="app-box" id="formBox">
        <div class="card">
            <div class="tabs">
                <div class="tab active" onclick="setMode('html', this)">Input HTML</div>
                <div class="tab" onclick="setMode('zip', this)">Import ZIP</div>
                <div class="tab" onclick="setMode('url', this)">Import Link</div>
            </div>

            <form id="buildForm">
                <input type="hidden" id="selectedMode" value="html">

                <div id="modeHtml" class="form-group">
                    <label>Paste HTML Code</label>
                    <textarea id="htmlContent" rows="4" placeholder="<h1>Hello World</h1>"></textarea>
                </div>

                <div id="modeZip" class="form-group" style="display:none;">
                    <label>Upload HTML or ZIP File</label>
                    <input type="file" id="zipFile" accept=".zip,.html">
                </div>

                <div id="modeUrl" class="form-group" style="display:none;">
                    <label>Website URL</label>
                    <input type="url" id="webUrl" placeholder="https://example.com">
                </div>

                <div class="form-group">
                    <label>App Name</label>
                    <input type="text" id="appName" placeholder="My Awesome App" required>
                </div>

                <div class="form-group">
                    <label>App Icon (Any Size / Format)</label>
                    <input type="file" id="iconFile" accept="image/*">
                </div>

                <div class="form-group">
                    <label>Platform</label>
                    <select id="platform">
                        <option value="android">Android (.APK)</option>
                        <option value="ios">iOS Web App (.IPA)</option>
                    </select>
                </div>

                <button type="submit" class="next-btn">Next &gt;&gt;</button>
            </form>
        </div>
    </div>

    <div class="modal" id="processModal">
        <div class="spinner" id="loader"></div>
        <div class="status-text" id="statusText">Resizing Icon & Processing Files...</div>
        <a href="#" class="dl-btn" id="dlBtn">Download APK Now</a>
    </div>

    <script>
        function startFlow() {
            document.getElementById('formBox').style.display = 'block';
            window.scrollTo({ top: document.getElementById('formBox').offsetTop - 20, behavior: 'smooth' });
        }

        function setMode(mode, tabElem) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tabElem.classList.add('active');
            document.getElementById('selectedMode').value = mode;

            document.getElementById('modeHtml').style.display = mode === 'html' ? 'block' : 'none';
            document.getElementById('modeZip').style.display = mode === 'zip' ? 'block' : 'none';
            document.getElementById('modeUrl').style.display = mode === 'url' ? 'block' : 'none';
        }

        document.getElementById('buildForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const modal = document.getElementById('processModal');
            const statusText = document.getElementById('statusText');
            const loader = document.getElementById('loader');
            const dlBtn = document.getElementById('dlBtn');

            modal.style.display = 'flex';
            statusText.innerText = "Processing & Compiling App...";
            loader.style.display = 'block';
            dlBtn.style.display = 'none';

            const formData = new FormData();
            formData.append('mode', document.getElementById('selectedMode').value);
            formData.append('appName', document.getElementById('appName').value);
            formData.append('platform', document.getElementById('platform').value);
            formData.append('htmlContent', document.getElementById('htmlContent').value);
            formData.append('webUrl', document.getElementById('webUrl').value);

            const iconFile = document.getElementById('iconFile').files[0];
            if(iconFile) formData.append('icon', iconFile);

            const zipFile = document.getElementById('zipFile').files[0];
            if(zipFile) formData.append('zipFile', zipFile);

            try {
                const res = await fetch('/api/build-app', { method: 'POST', body: formData });
                const data = await res.json();

                if (data.success) {
                    statusText.innerText = "Done! Your App is Ready.";
                    loader.style.display = 'none';
                    dlBtn.href = data.downloadUrl;
                    dlBtn.style.display = 'inline-block';
                } else {
                    statusText.innerText = "Error: " + data.message;
                }
            } catch (err) {
                statusText.innerText = "Server Connection Failed!";
            }
        });
    </script>
</body>
</html>
