<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRRYKAL - Web2App Builder Engine</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
        
        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header { text-align: center; margin-bottom: 28px; }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .header p { color: var(--text-muted); font-size: 0.95rem; }

        .form-group { margin-bottom: 20px; }
        label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 0.88rem; font-weight: 600; color: #cbd5e1; }
        
        input, select, textarea {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
        }

        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.5); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* Stylish Status Card */
        #statusCard {
            margin-top: 24px;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .status-building {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
        }

        .status-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin: 0 auto 12px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fa-solid fa-cube"></i> MIRRYKAL Engine</h1>
        <p>Convert HTML Code or Web URLs into Real Android APK</p>
    </div>

    <form id="buildForm">
        <div class="form-group">
            <label><i class="fa-solid fa-mobile-screen-button"></i> App Name</label>
            <input type="text" id="appName" name="appName" placeholder="e.g. My Custom App" required>
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-layer-group"></i> Source Type</label>
            <select id="mode" name="mode" onchange="toggleMode()">
                <option value="html">Custom HTML Code</option>
                <option value="url">Website URL Redirect</option>
            </select>
        </div>

        <div class="form-group" id="htmlGroup">
            <label><i class="fa-solid fa-code"></i> HTML / CSS / JS Source</label>
            <textarea id="htmlContent" name="htmlContent" rows="6" placeholder="<h1>Welcome to My App</h1>"></textarea>
        </div>

        <div class="form-group" id="urlGroup" style="display: none;">
            <label><i class="fa-solid fa-link"></i> Website URL</label>
            <input type="url" id="webUrl" name="webUrl" placeholder="https://yourwebsite.com">
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
            <i class="fa-solid fa-gears"></i> Build Real APK
        </button>
    </form>

    <div id="statusCard">
        <div id="loaderIcon" class="loader"></div>
        <p id="statusMsg" style="font-size: 0.95rem; font-weight: 600;"></p>
    </div>
</div>

<script>
    function toggleMode() {
        const mode = document.getElementById('mode').value;
        if (mode === 'html') {
            document.getElementById('htmlGroup').style.display = 'block';
            document.getElementById('urlGroup').style.display = 'none';
        } else {
            document.getElementById('htmlGroup').style.display = 'none';
            document.getElementById('urlGroup').style.display = 'block';
        }
    }

    document.getElementById('buildForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        const statusCard = document.getElementById('statusCard');
        const statusMsg = document.getElementById('statusMsg');
        const loaderIcon = document.getElementById('loaderIcon');

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';

        statusCard.style.display = 'block';
        statusCard.className = 'status-building';
        loaderIcon.style.display = 'block';
        statusMsg.innerText = "Building Engine Triggered! Generating APK in background...";

        const formData = new FormData(e.target);

        try {
            const response = await fetch('/api/build-app', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.success) {
                statusMsg.innerText = "Build Successfully Triggered! Your APK is compiling in the pipeline.";
            } else {
                loaderIcon.style.display = 'none';
                statusCard.className = 'status-error';
                statusMsg.innerText = "Error: " + data.message;
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-gears"></i> Build Real APK';
            }
        } catch (err) {
            loaderIcon.style.display = 'none';
            statusCard.className = 'status-error';
            statusMsg.innerText = "Connection Failed: " + err.message;
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-gears"></i> Build Real APK';
        }
    });
</script>

</body>
</html>
