name: Build Real Android APK

on:
  repository_dispatch:
    types: [build_apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build APK with Custom App Icon
        run: |
          npm install -g @capacitor/cli @capacitor/core @capacitor/android @capacitor/assets
          mkdir -p www assets
          
          # HTML Setup
          cat << 'EOF' > www/index.html
          ${{ github.event.client_payload.html_content || '<h1>MIRRYKAL Web2App Test</h1>' }}
          EOF

          # Package Config
          echo '{"name":"testapp","version":"1.0.0","private":true}' > package.json
          npm install @capacitor/core @capacitor/android @capacitor/assets

          # Decode Base64 Icon if provided
          if [ -n "${{ github.event.client_payload.icon_base64 }}" ]; then
            echo "${{ github.event.client_payload.icon_base64 }}" | base64 -d > assets/icon.png
          else
            # Default placeholder image if no icon is provided
            curl -s "https://via.placeholder.com/512.png?text=APP" -o assets/icon.png
          fi

          # Init Capacitor
          npx cap init "${{ github.event.client_payload.app_name || 'MIRRYKAL_App' }}" "com.test.app" --web-dir www
          npx cap add android

          # Auto Generate Native Android Icons across all densities
          npx cap-assets generate --android

          # Kotlin duplicate class conflict resolution
          cat << 'EOF' >> android/build.gradle

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                      exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
                  }
              }
          }
          EOF

          npx cap sync
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Create Release & Upload Raw APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "${{ github.event.client_payload.app_name || 'MIRRYKAL_App' }} #${{ github.run_number }}"
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
