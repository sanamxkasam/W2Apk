name: Build Real Android APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build APK
        run: |
          npm install -g @capacitor/cli @capacitor/core @capacitor/android
          mkdir -p www
          cat << 'EOF' > www/index.html
          ${{ github.event.client_payload.html_content }}
          EOF
          echo '{"name":"testapp","version":"1.0.0","private":true}' > package.json
          npm install @capacitor/core @capacitor/android
          npx cap init "${{ github.event.client_payload.app_name }}" "com.test.app" --web-dir www
          npx cap add android
          npx cap sync
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name }}-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
